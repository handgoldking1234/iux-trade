<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GlobalTrade - 회원가입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/css/reset.css">
<link rel="stylesheet" href="assets/css/common.css">
</head>
<body>
<!-- 회원가입: 로고 / 폼 카드 -->
<div class="auth-body">
  <div class="auth-logo">
    <span class="mark"><i class="icon icon-globe icon-44"></i></span>
    <div class="word word-sm">Global<em>Trade</em></div>
  </div>
  <div class="auth-stage stage-wide">
    <div class="auth-aside aside-left">
      <h2>세상을 잇는<br>글로벌 투자 플랫폼</h2>
      <span class="line"></span>
      <p class="en">TRADE BEYOND BORDERS</p>
    </div>
    <div class="reg-card">
      <div class="reg-head">
        <div class="tit">
          <span class="ico"><i class="icon icon-user icon-20"></i></span>
          회원가입 <small>REGISTER</small>
        </div>
        <span class="sub">지금, 더 넓은 세상에 투자하세요.</span>
      </div>
      <div class="reg-banner">회원정보와 출금계좌 정보를 정확하게 입력해 주세요.</div>
      <div class="reg-row"><div class="lab"><i class="icon icon-user icon-15"></i>이름</div><input type="text" placeholder="홍길동"></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-at icon-15"></i>아이디</div><input type="text" value="test1"><button type="button" class="btn btn-sm btn-line-blue" data-dupcheck="아이디">아이디 중복확인</button></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-tag icon-15"></i>닉네임</div><input type="text" placeholder="닉네임을 입력하세요."><button type="button" class="btn btn-sm btn-line-blue" data-dupcheck="닉네임">닉네임 중복확인</button></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-lock icon-15"></i>비밀번호</div><input type="password" placeholder="비밀번호를 입력하세요."></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-shield-check icon-15"></i>비밀번호 확인</div><input type="password" placeholder="비밀번호를 다시 입력하세요."></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-phone icon-15"></i>휴대전화</div><input type="text" placeholder="010-1234-5678"></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-mail icon-15"></i>E-mail</div><input type="text" placeholder="example@naver.com"></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-bank icon-15"></i>은행명</div><select><option>은행을 선택하세요.</option><option>국민은행</option><option>신한은행</option><option>우리은행</option><option>하나은행</option><option>농협은행</option></select></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-card icon-15"></i>계좌번호</div><input type="text" placeholder="계좌번호를 입력하세요. (- 제외)"></div>
      <div class="reg-row"><div class="lab"><i class="icon icon-user-check icon-15"></i>예금주</div><input type="text" placeholder="예금주명을 입력하세요."></div>
      <div class="reg-row" data-optional><div class="lab"><i class="icon icon-user-plus icon-15"></i>추천인 아이디</div><input type="text" placeholder="추천인 아이디가 있을 경우 입력하세요."></div>
      <div class="captcha">
        <label class="rc-check">
          <input type="checkbox">
          <span class="rc-box" aria-hidden="true"></span>
          <span class="rc-label">사람입니다</span>
        </label>
        <div class="rc-brand">
          <svg class="rc-mark" width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3.6a8.4 8.4 0 0 1 7.3 4.2" stroke="#4285f4" stroke-width="3" stroke-linecap="round"></path><path d="M18.2 2.2 21.4 7l-5.5.9z" fill="#4285f4"></path><path d="M20.4 12a8.4 8.4 0 0 1-4.2 7.3" stroke="#9aa0a6" stroke-width="3" stroke-linecap="round"></path><path d="M18.6 20.6 13.4 22l1.6-5.4z" fill="#9aa0a6"></path><path d="M9.8 20.2A8.4 8.4 0 0 1 4.4 8.6" stroke="#c5c9ce" stroke-width="3" stroke-linecap="round"></path><path d="M2.2 10.4 4.6 5.3l3.9 3.9z" fill="#c5c9ce"></path></svg>
          <span class="rc-name">reCAPTCHA</span>
          <span class="rc-sub">개인정보 보호 · 약관</span>
        </div>
      </div>
      <div class="btn-row">
        <a href="index.html" class="btn btn-gray btn-lg">취소</a>
        <a href="index.html" class="btn btn-blue btn-lg" data-reg-submit>가입</a>
      </div>
    </div>
    <div class="auth-aside aside-right">
      <p class="stack">GLOBAL<br>MARKETS<br>YOUR<br>TRADE</p>
      <span class="line"></span>
    </div>
  </div>
  <div class="auth-sub">© 2026 GLOBALTRADE. ALL RIGHTS RESERVED.</div>
</div>

<!-- 모달: 중복확인 결과 -->
<div class="modal" id="modal-alert">
  <div class="modal-box modal-alert">
    <span class="alert-ico ico-ok"><i class="icon icon-check icon-26"></i></span>
    <span class="alert-ico ico-ng"><i class="icon icon-alert icon-26"></i></span>
    <p class="alert-msg"></p>
    <button type="button" class="btn btn-blue btn-lg btn-full" data-modal-close>확인</button>
  </div>
</div>
<script src="assets/js/common.js"></script>
</body>
</html>
